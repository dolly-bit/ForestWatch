# One-command stack: docker compose up --build
# Needs data/stacks/{before,after}/*.npz on the host (built by scripts/build_stacks.py).
services:
  db:
    image: postgis/postgis:16-3.4          # PostGIS image so a geometry column can be added later
    environment:
      POSTGRES_USER: forestwatch
      POSTGRES_PASSWORD: forestwatch
      POSTGRES_DB: forestwatch
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forestwatch"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
  api:
    build: { context: ., dockerfile: Dockerfile.api }
    environment: &env
      DATABASE_URL: postgresql+psycopg2://forestwatch:forestwatch@db:5432/forestwatch
      REDIS_URL: redis://redis:6379/0
      ROOT_DIR: /app
      CORS_ORIGINS: http://localhost:3000
    volumes: [./data:/app/data, ./models:/app/models, ./configs:/app/configs]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
    ports: ["8000:8000"]
  worker:
    build: { context: ., dockerfile: Dockerfile.api }
    command: rq worker forestwatch --url redis://redis:6379/0
    environment: *env
    volumes: [./data:/app/data, ./models:/app/models, ./configs:/app/configs]
    depends_on: [api, redis]
  web:
    image: node:20-alpine
    working_dir: /web
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes: [./frontend:/web]
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
