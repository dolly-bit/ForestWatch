[alembic]
script_location = backend/alembic
prepend_sys_path = backend
# sqlalchemy.url is taken from the DATABASE_URL environment variable in env.py

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
