[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forestwatch"
version = "0.1.0"
description = "Phase 1: data pipeline, NDVI baseline and spatial evaluation for vegetation-loss monitoring"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pyyaml", "matplotlib", "scikit-image"]

[project.optional-dependencies]
geo = ["rasterio", "pystac-client", "pyproj"]
ml = ["torch"]
api = ["fastapi", "uvicorn[standard]", "sqlalchemy>=2.0", "alembic", "psycopg2-binary", "redis", "rq", "pydantic>=2", "httpx"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "backend"]
testpaths = ["tests"]
